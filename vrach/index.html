<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Вопросы пациенток</title>
<link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#F6F2FC;--card:#fff;--ink:#2E2538;--mut:#786C86;--line:#E7DFF3;--acc:#8F6BDA;--grad:linear-gradient(125deg,#8F6BDA,#B583D6 50%,#E59CC6);--pink:#E46FA8}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 Manrope,system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header svg{width:44px;height:44px;border-radius:12px;flex:none}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
header small{display:block;color:var(--mut);font-size:13px}
.login{background:var(--card);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;max-width:420px}
input,textarea{width:100%;font:500 15px/1.5 Manrope,sans-serif;color:var(--ink);background:#FBF9FE;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
button{font:700 14px Manrope,sans-serif;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--grad);color:#fff}
button.gh{background:#EFE8FA;color:#5B3FA0}
button.dl{background:transparent;color:#B04A7D;padding:11px 8px}
button:disabled{opacity:.5;cursor:default}
.err{color:#B04A7D;font-size:13px;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{background:#fff;color:var(--mut);padding:8px 14px;border-radius:99px;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff}
.tabs b{font-weight:800;margin-left:4px}
.list{display:flex;flex-direction:column;gap:12px}
.q{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.tag{background:#EFE8FA;color:#5B3FA0;border-radius:99px;padding:2px 9px;font-weight:700}
.tag.pub{background:#FBE3EF;color:#B04A7D}
.qt{font-size:16px;font-weight:700;white-space:pre-wrap;word-break:break-word}
label{font-size:12px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--mut);background:#fff;border-radius:16px;padding:14px 16px;margin:0 0 14px}
.empty{color:var(--mut);text-align:center;padding:40px 0}
.ok{font-size:12px;color:#5B3FA0;font-weight:700}
</style>
</head><body><div class="wrap">
<header><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B7BE0"/><stop offset="1" stop-color="#F2A6C9"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="2.2"><path d="M50 18 C80 37.84 75.5 72.56 50 80 C24.5 72.56 20 37.84 50 18Z"/><path opacity=".8" d="M50 30 C68 46 65.3 74 50 80 C34.7 74 32 46 50 30Z"/><path opacity=".6" d="M50 42 C56 54.16 55.1 75.44 50 80 C44.9 75.44 44 54.16 50 42Z"/></g></svg>
<div><h1>Вопросы пациенток</h1><small>анонимно, без имён и телефонов</small></div></header>

<form class="login" id="login">
  <b>Вход для врача</b>
  <input type="password" id="key" placeholder="Пароль" autocomplete="current-password">
  <p class="err" id="lerr" hidden></p>
  <button type="submit">Войти</button>
</form>

<main id="main" hidden>
  <p class="hint">«Ответить лично» – ответ увидит только автор вопроса в своём «Тонусе». «Опубликовать» – ответ увидят все в разделе «Полезное», автор тоже. Перед публикацией уберите из вопроса личные детали.</p>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
</main>
</div>
<script>
const ST={new:'новый',draft:'черновик',answered:'отвечен лично',published:'опубликован',hidden:'скрыт'};
const TABS=[['new','Новые'],['draft','Черновики'],['answered','Отвечены лично'],['published','Опубликованы'],['hidden','Скрытые']];
let key='',items=[],tab='new';
try{key=localStorage.getItem('vk')||''}catch(e){}
const api=async(body)=>{const r=await fetch('/api/vrach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,...body})});const j=await r.json().catch(()=>({}));j.status=r.status;return j};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){const j=await api({action:'list'});
  if(j.status===401){key='';try{localStorage.removeItem('vk')}catch(e){};show(false,'Неверный пароль');return}
  if(j.status===503){show(true);document.getElementById('list').innerHTML='<p class="empty">Хранилище ещё не подключено в Vercel</p>';return}
  if(!j.ok){show(true);document.getElementById('list').innerHTML='<p class="empty">Не удалось загрузить. Обновите страницу</p>';return}
  items=j.items;show(true);draw()}
function show(on,err){document.getElementById('login').hidden=on;document.getElementById('main').hidden=!on;const e=document.getElementById('lerr');e.hidden=!err;e.textContent=err||''}
function draw(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,n])=>'<button class="'+(k===tab?'on':'')+'" data-t="'+k+'">'+n+'<b>'+items.filter(x=>x.status===k).length+'</b></button>').join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
  const l=items.filter(x=>x.status===tab);
  document.getElementById('list').innerHTML=l.length?l.map(x=>'<div class="q" data-id="'+x.id+'"><div class="meta"><span class="tag'+(x.status==='published'?' pub':'')+'">'+ST[x.status]+'</span><span>'+new Date(x.ts).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+'</span><span>'+(x.src==='app'?'из приложения':'с сайта')+'</span><span>'+(x.lang==='kz'?'на казахском':'на русском')+'</span></div>'
    +'<div class="qt">'+esc(x.q)+'</div>'
    +'<label>Вопрос для публикации<textarea class="aq" rows="2">'+esc(x.aq||x.q)+'</textarea></label>'
    +'<label>Ответ<textarea class="a" rows="5" placeholder="Ваш ответ">'+esc(x.a)+'</textarea></label>'
    +'<div class="row">'+(x.status==='published'?'<button class="pb">Обновить ответ</button><button class="gh hd">Снять с публикации</button>':'<button class="pb">Опубликовать</button><button class="gh rp">'+(x.status==='answered'?'Обновить личный ответ':'Ответить лично')+'</button><button class="gh sv">Сохранить черновик</button>'+(x.status!=='hidden'?'<button class="gh hd">Скрыть</button>':''))+'<button class="dl">Удалить</button><span class="ok"></span></div></div>').join(''):'<p class="empty">Здесь пока пусто</p>';
  document.querySelectorAll('.q').forEach(c=>{const id=c.dataset.id,ok=c.querySelector('.ok');
    const send=async(action)=>{c.querySelectorAll('button').forEach(b=>b.disabled=true);
      const j=await api({action,id,a:c.querySelector('.a').value,aq:c.querySelector('.aq').value});
      c.querySelectorAll('button').forEach(b=>b.disabled=false);
      if(!j.ok){ok.textContent=j.error==='empty'?'Сначала напишите ответ':'Не получилось, попробуйте ещё раз';return}
      if(action==='delete')items=items.filter(x=>x.id!==id);else items=items.map(x=>x.id===id?j.item:x);
      ok.textContent='Сохранено';setTimeout(draw,700)};
    const on=(s,a)=>{const b=c.querySelector(s);if(b)b.onclick=()=>send(a)};
    on('.pb','publish');on('.rp','reply');on('.sv','save');on('.hd','hide');
    c.querySelector('.dl').onclick=()=>{if(c.dataset.sure){send('delete')}else{c.dataset.sure=1;c.querySelector('.dl').textContent='Точно удалить?'}}})}
document.getElementById('login').onsubmit=e=>{e.preventDefault();key=document.getElementById('key').value.trim();try{localStorage.setItem('vk',key)}catch(e){}load()};
if(key)load();
</script>
</body></html>
